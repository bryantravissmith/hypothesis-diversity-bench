name: test

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check .
      - run: python tests/test_cases.py
      - run: python tests/test_pipeline.py
